<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ellos Closet">
<meta name="theme-color" content="#fff"><title>Ellos Closet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:620px;margin:auto;padding:15px 12px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 18px #00000012}
.logo{width:190px;display:block;margin:0 auto 8px}.sub{text-align:center;font-size:11px;letter-spacing:2.5px;font-weight:800;margin-bottom:24px}
h1{font-size:20px;margin:0 0 17px}label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;margin:13px 0 6px}
input,textarea,select{width:100%;font-size:16px;padding:13px;border:1px solid #d0d0d0;border-radius:10px;background:#fff;color:#111}
textarea{height:82px;resize:none}button{width:100%;min-height:50px;border-radius:11px;font-size:15px;font-weight:800;border:0;margin-top:11px}
.black{background:#111;color:#fff}.white{background:#fff;color:#111;border:1px solid #aaa}
.preview-title{font-weight:800;text-align:center;margin:23px 0 12px}.preview-title span{font-weight:400;color:#666}
.label-holder{display:flex;justify-content:center}.label{width:3in;height:5in;background:#fff;padding:.20in;border:1px dashed #999;overflow:hidden}
.llogo{display:block;width:1.68in;height:auto;max-height:.70in;object-fit:contain;margin:0 auto 7px}
.title{text-align:center;border-top:2px solid #111;border-bottom:1px solid #111;padding:6px 0;font-size:10px;font-weight:800;letter-spacing:1.4px;margin-bottom:11px}
.item{margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #ddd}.item small,.pay small,.code small{display:block;font-size:8px;font-weight:800;text-transform:uppercase;color:#555}
.item strong{display:block;font-size:13px;line-height:1.18;word-break:break-word}
.pay{border:2px solid #111;text-align:center;padding:7px;margin-top:8px}.pay strong{display:block;font-size:20px;margin-top:2px}
.code{border:2px solid #111;text-align:center;padding:6px;margin-top:8px}.code strong{display:block;font-size:18px;margin-top:2px;letter-spacing:1px}
.barcode{height:21px;margin:5px auto 0;width:92%;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 8px)}
.thanks{font-size:8px;font-weight:800;text-align:center;margin-top:5px}.note{text-align:center;color:#666;font-size:11px;margin-top:9px}
@media(min-width:800px){.wrap{max-width:1050px}.card{display:grid;grid-template-columns:1fr 1fr;gap:30px}.preview-title{margin-top:0}}
@media print{body{background:#fff}.wrap{padding:0}.card{display:block;box-shadow:none;padding:0}.form,.preview-title,.print,.note{display:none!important}.preview{padding:0}.label{border:0;width:3in;height:5in}@page{size:3in 5in;margin:0}}
